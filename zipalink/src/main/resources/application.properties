# --- App ---
server.port=8080
# URL base usada para montar o link curto (ex: http://localhost:8080/AbC1234)
app.base-url=http://localhost:8080

# --- JWT ---
# Segredo usado para assinar os tokens (HS256 exige pelo menos 32 caracteres).
# NUNCA use este valor em produção — troque por algo aleatório e mantenha em uma
# variável de ambiente (aqui dá pra sobrescrever com APP_JWT_SECRET).
app.jwt.secret=${APP_JWT_SECRET:troque-esse-segredo-por-uma-string-aleatoria-de-32+caracteres}
# 24 horas em milissegundos
app.jwt.expiration-ms=86400000

# --- Admin inicial ---
# Criado automaticamente na primeira subida da aplicação, se ainda não existir
# nenhum usuário com essa role. Troque a senha padrão assim que logar.
app.admin.email=${APP_ADMIN_EMAIL:admin@zipalink.com}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.admin.name=Administrador
